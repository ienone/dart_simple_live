name: test-Slive packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        default: all
        options: [all, android, ios, macos, windows, linux]

permissions:
  contents: read

concurrency:
  group: test-packages-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          platforms = [
              dict(platform="android", arch="all", runner="ubuntu-24.04"),
              dict(platform="ios", arch="arm64", runner="macos-latest"),
              dict(platform="macos", arch="universal", runner="macos-latest"),
              dict(platform="windows", arch="x64", runner="windows-latest"),
              dict(platform="linux", arch="x64", runner="ubuntu-24.04"),
              dict(platform="linux", arch="arm64", runner="ubuntu-24.04-arm"),
          ]
          selected = [p for p in platforms if os.environ["PLATFORM"] in ("all", p["platform"])]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": selected}) + "\n")
          PYTHON

  build:
    needs: platforms
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Prepare separate test application
        run: python scripts/prepare_test_build.py
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: zulu
          java-version: '17'
      - name: Restore fixed Android test signing key
        if: matrix.platform == 'android'
        env:
          TEST_ANDROID_KEYSTORE_BASE64: ${{ secrets.TEST_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$TEST_ANDROID_KEYSTORE_BASE64" || { echo 'Missing TEST_ANDROID_KEYSTORE_BASE64 secret'; exit 1; }
          umask 077
          mkdir -p ~/.android
          printf '%s' "$TEST_ANDROID_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey | grep -F '1C:E8:2F:B0:55:E6:91:95:DD:24:D3:FD:1E:61:4B:9B:4D:0D:03:D8:70:78:AA:58:97:2A:1B:BE:53:C8:0D:96'
      - name: Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            libasound2-dev libmpv-dev libayatana-appindicator3-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        if: matrix.platform != 'linux' || matrix.arch != 'arm64'
        with:
          channel: stable
          flutter-version: '3.47.8'
          # Windows SDK cache saving previously took longer than downloading it.
          cache: ${{ matrix.platform != 'windows' }}
          pub-cache: false
      - name: Flutter on Linux ARM64
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch 3.47.8 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Cache hosted Dart packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE || '~/.pub-cache' }}/hosted
          key: pub-hosted-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-hosted-${{ runner.os }}-${{ runner.arch }}-
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.platform == 'android'
        with:
          cache-read-only: false
      - name: Rust
        id: rust
        run: |
          rustup update stable --no-self-update
          echo "version=$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            simple_live_app/build/**/cargokit_build
            simple_live_app/build/rust_lib_simple_live_app
          key: rust-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('simple_live_app/rust/Cargo.lock', 'simple_live_app/rust_builder/**', 'simple_live_app/android/**/*.gradle.kts') }}-${{ hashFiles('simple_live_app/rust/src/**') }}
          restore-keys: rust-${{ matrix.platform }}-${{ matrix.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('simple_live_app/rust/Cargo.lock', 'simple_live_app/rust_builder/**', 'simple_live_app/android/**/*.gradle.kts') }}-
      - name: Dependencies
        working-directory: simple_live_app
        run: flutter pub get
      - name: Build Android
        if: matrix.platform == 'android'
        working-directory: simple_live_app
        run: |
          flutter build apk --release --no-pub --split-per-abi
          mkdir -p ../dist
          for file in build/app/outputs/flutter-apk/*-release.apk; do
            arch=$(basename "$file" | sed 's/^app-//;s/-release.apk$//')
            cp "$file" "../dist/test-Slive-android-$arch.apk"
          done
      - name: Build iOS (unsigned)
        if: matrix.platform == 'ios'
        working-directory: simple_live_app
        run: |
          flutter build ios --release --no-pub --no-codesign
          mkdir -p ../dist build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          (cd build/ios/iphoneos && zip -qry ../../../../dist/test-Slive-ios-unsigned.ipa Payload)
      - name: Build macOS
        if: matrix.platform == 'macos'
        working-directory: simple_live_app
        run: |
          flutter build macos --release --no-pub
          mkdir -p ../dist
          app=$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)
          codesign --force --deep --sign - "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" ../dist/test-Slive-macos-universal.zip
          bash ../scripts/package_test_macos_dmg.sh "$app" ../dist/test-Slive-macos-universal.dmg
      - name: Build Windows
        if: matrix.platform == 'windows'
        working-directory: simple_live_app
        run: |
          flutter build windows --release --no-pub --verbose > ../windows-build.log 2>&1 || {
            tail -n 200 ../windows-build.log
            exit 1
          }
          tail -n 20 ../windows-build.log
      - name: Upload Windows build diagnostics
        if: failure() && matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: windows-build.log
          retention-days: 7
      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive simple_live_app/build/windows/x64/runner/Release/* dist/test-Slive-windows-x64.zip
          & 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe' scripts/test-windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Linux
        if: matrix.platform == 'linux'
        working-directory: simple_live_app
        run: flutter build linux --release --no-pub
      - name: Package Linux
        if: matrix.platform == 'linux'
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: bash scripts/package_test_linux.sh
      - name: Upload android-arm64-v8a.apk
        if: ${{ !cancelled() && matrix.platform == 'android' && (success() || hashFiles('dist/test-Slive-android-arm64-v8a.apk') != '') }}
        uses: ./.github/actions/upload-package
        with:
          path: dist/test-Slive-android-arm64-v8a.apk
      - name: Upload android-armeabi-v7a.apk
        if: ${{ !cancelled() && matrix.platform == 'android' && (success() || hashFiles('dist/test-Slive-android-armeabi-v7a.apk') != '') }}
        uses: ./.github/actions/upload-package
        with:
          path: dist/test-Slive-android-armeabi-v7a.apk
      - name: Upload android-x86_64.apk
        if: ${{ !cancelled() && matrix.platform == 'android' && (success() || hashFiles('dist/test-Slive-android-x86_64.apk') != '') }}
        uses: ./.github/actions/upload-package
        with:
          path: dist/test-Slive-android-x86_64.apk
      - name: Upload ios-unsigned.ipa
        if: ${{ !cancelled() && matrix.platform == 'ios' && (success() || hashFiles('dist/test-Slive-ios-unsigned.ipa') != '') }}
        uses: ./.github/actions/upload-package
        with:
          path: dist/test-Slive-ios-unsigned.ipa
      - name: Upload macos-universal.dmg
        if: ${{ !cancelled() && matrix.platform == 'macos' && (success() || hashFiles('dist/test-Slive-macos-universal.dmg') != '') }}
        uses: ./.github/actions/upload-package
        with:
          path: dist/test-Slive-macos-universal.dmg
      - name: Upload macos-universal.zip
        if: ${{ !cancelled() && matrix.platform == 'macos' && (success() || hashFiles('dist/test-Slive-macos-universal.zip') != '') }}
        uses: ./.github/actions/upload-package
        with:
          path: dist/test-Slive-macos-universal.zip
      - name: Upload windows-x64-setup.exe
        if: ${{ !cancelled() && matrix.platform == 'windows' && (success() || hashFiles('dist/test-Slive-windows-x64-setup.exe') != '') }}
        uses: ./.github/actions/upload-package
        with:
          path: dist/test-Slive-windows-x64-setup.exe
      - name: Upload windows-x64.zip
        if: ${{ !cancelled() && matrix.platform == 'windows' && (success() || hashFiles('dist/test-Slive-windows-x64.zip') != '') }}
        uses: ./.github/actions/upload-package
        with:
          path: dist/test-Slive-windows-x64.zip
      - name: Upload linux-${{ matrix.arch }}.deb
        if: ${{ !cancelled() && matrix.platform == 'linux' && (success() || hashFiles(format('dist/test-Slive-linux-{0}.deb', matrix.arch)) != '') }}
        uses: ./.github/actions/upload-package
        with:
          path: dist/test-Slive-linux-${{ matrix.arch }}.deb
      - name: Upload linux-${{ matrix.arch }}.tar.gz
        if: ${{ !cancelled() && matrix.platform == 'linux' && (success() || hashFiles(format('dist/test-Slive-linux-{0}.tar.gz', matrix.arch)) != '') }}
        uses: ./.github/actions/upload-package
        with:
          path: dist/test-Slive-linux-${{ matrix.arch }}.tar.gz
